name: ndevio
display_name: ndevio
# use 'hidden' to remove plugin from napari hub search results
visibility: public
# see https://napari.org/stable/plugins/technical_references/manifest.html#fields for valid categories
categories: ["IO", "Dataset", "Utilities"]
contributions:
  commands:
    - id: ndevio.get_reader
      python_name: ndevio._napari_reader:napari_get_reader
      title: Open file with ndevio
    - id: ndevio.make_plugin_installer_widget
      python_name: ndevio.widgets._plugin_install_widget:PluginInstallerWidget
      title: Install BioIO Reader Plugins
    - id: ndevio.make_utilities_widget
      python_name: ndevio.widgets._utilities_container:UtilitiesContainer
      title: I/O Utilities
    - id: ndevio.make_ndev_logo
      python_name: ndevio.sampledata._sample_data:ndev_logo
      title: Load ndev logo
    - id: ndevio.make_scratch_assay
      python_name: ndevio.sampledata._sample_data:scratch_assay
      title: Load scratch assay data
    - id: ndevio.make_neocortex
      python_name: ndevio.sampledata._sample_data:neocortex
      title: Load neocortex data
    - id: ndevio.make_neuron_raw
      python_name: ndevio.sampledata._sample_data:neuron_raw
      title: Load raw neuron data
    - id: ndevio.make_neuron_labels
      python_name: ndevio.sampledata._sample_data:neuron_labels
      title: Load neuron labels data
    - id: ndevio.make_neuron_labels_processed
      python_name: ndevio.sampledata._sample_data:neuron_labels_processed
      title: Load processed neuron labels data
  readers:
    - command: ndevio.get_reader
      accepts_directories: true
      filename_patterns: [
        '*.1sc', '*.264', '*.265', '*.2fl', '*.3fr', '*.3g2', '*.a64', '*.acff', '*.adp', '*.afi',
        '*.afm', '*.aim', '*.al3d', '*.am', '*.amiramesh', '*.amr', '*.amv', '*.apl', '*.apng', '*.arf',
        '*.arw', '*.asf', '*.avc', '*.avi', '*.avs', '*.avs2', '*.bay', '*.bif', '*.bin', '*.bip',
        '*.bmp', '*.btf', '*.c01', '*.cdg', '*.cfg', '*.cgi', '*.ch5', '*.cif', '*.cr2', '*.crw',
        '*.csv', '*.ct', '*.cxd', '*.czi', '*.dat', '*.dcm', '*.dcr', '*.dib', '*.dip', '*.dir',
        '*.dm2', '*.dm3', '*.dm4', '*.dng', '*.dnxhd', '*.dti', '*.dv', '*.dvd', '*.eps', '*.erf',
        '*.exp', '*.exr', '*.fdf', '*.fff', '*.ffr', '*.fits', '*.flex', '*.fli', '*.frm', '*.gel',
        '*.gif', '*.grey', '*.hdf', '*.hdr', '*.hed', '*.his', '*.htd', '*.html', '*.hx', '*.i2i',
        '*.icb', '*.ics', '*.ids', '*.if', '*.iiq', '*.im3', '*.img', '*.ims', '*.imt', '*.inr',
        '*.ipl', '*.ipm', '*.ipw', '*.ism', '*.jfif', '*.jif', '*.jng', '*.jp2', '*.jpg', '*.jpk',
        '*.jpx', '*.l2d', '*.labels', '*.lei', '*.lif', '*.liff', '*.lim', '*.lms', '*.lsm', '*.mcidas',
        '*.mdb', '*.mnc', '*.mng', '*.mod', '*.mov', '*.mp4', '*.mpo', '*.mrc', '*.mrw', '*.msp',
        '*.msr', '*.mtb', '*.mvd2', '*.naf', '*.nd', '*.nd2', '*.ndpi', '*.ndpis', '*.nef', '*.nhdr',
        '*.nii', '*.nii.gz', '*.nrrd', '*.obf', '*.obsep', '*.oib', '*.oif', '*.oir', '*.ome', '*.ome.btf',
        '*.ome.tf2', '*.ome.tf8', '*.ome.tif', '*.ome.tiff', '*.ome.xml', '*.par', '*.pbm', '*.pcoraw', '*.pcx', '*.pdf',
        '*.pds', '*.pgm', '*.pic', '*.pict', '*.png', '*.pnl', '*.ppm', '*.pr3', '*.ps', '*.psd',
        '*.qptiff', '*.r3d', '*.raw', '*.rcpnl', '*.rec', '*.scn', '*.sdt', '*.seq', '*.sif', '*.sld',
        '*.sldy', '*.sm2', '*.sm3', '*.spc', '*.spe', '*.spi', '*.spider', '*.stk', '*.stp', '*.svs',
        '*.sxm', '*.tf2', '*.tf8', '*.tfr', '*.tga', '*.tif', '*.tiff', '*.tiles.ome.tif', '*.tnb', '*.top',
        '*.txt', '*.v', '*.vms', '*.vsi', '*.vws', '*.wat', '*.wlz', '*.xdce', '*.xml', '*.xqd',
        '*.xqf', '*.xv', '*.xvthumb', '*.xys', '*.zarr', '*.zarr*', '*.zfp', '*.zfr', '*.zif', '*.zvi',
      ]
  configurations:
    reader:
      title: Reader
      properties:
        suggest_reader_plugins:
          type: boolean
          default: true
          title: Suggest reader plugins
          description: >-
            Whether to suggest plugins to install when no reader can be found
            for a file.
        scene_handling:
          type: string
          default: Open Scene Widget
          title: Scene handling
          description: >-
            How to handle files with multiple scenes. Choose between showing
            a scene-selection widget, viewing all scenes as layers, or viewing
            only the first scene.
          enum:
            - Open Scene Widget
            - View All Scenes
            - View First Scene Only
        clear_layers_on_new_scene:
          type: boolean
          default: false
          title: Clear layers on new scene
          description: Whether to clear the viewer when selecting a new scene.
        max_in_mem_gb:
          type: number
          default: 8.0
          title: Max in-memory size (GB)
          description: >-
            Maximum uncompressed image size in GB to load eagerly. Larger
            images use dask.
          minimum: 0.5
          maximum: 128.0
    export:
      title: Export
      properties:
        canvas_scale:
          type: number
          default: 1.0
          title: Canvas scale
          description: Scale factor for exported figures and screenshots.
          minimum: 0.01
          maximum: 100.0
        override_canvas_size:
          type: boolean
          default: false
          title: Override canvas size
          description: >-
            Whether to override the canvas size when exporting screenshots.
        canvas_width:
          type: integer
          default: 1024
          title: Canvas width
          description: >-
            Canvas width in pixels when exporting screenshots (if override
            is enabled).
          minimum: 1
          maximum: 100000
        canvas_height:
          type: integer
          default: 1024
          title: Canvas height
          description: >-
            Canvas height in pixels when exporting screenshots (if override
            is enabled).
          minimum: 1
          maximum: 100000
  widgets:
    - command: ndevio.make_plugin_installer_widget
      display_name: Install BioIO Reader Plugins
    - command: ndevio.make_utilities_widget
      display_name: I/O Utilities
  sample_data:
    - command: ndevio.make_ndev_logo
      display_name: ndev logo
      key: ndevio.ndev_logo
    - command: ndevio.make_scratch_assay
      display_name: Scratch Assay Labeled (10T+2Ch) (4MB)
      key: ndevio.scratch_assay
    - command: ndevio.make_neocortex
      display_name: Neocortex (3Ch) (2MB)
      key: ndevio.neocortex
    - command: ndevio.make_neuron_raw
      display_name: Neuron Raw (2D+4Ch) (32MB)
      key: ndevio.neuron_raw
    - command: ndevio.make_neuron_labels
      display_name: Neuron Labels (2D+4Ch)
      key: ndevio.neuron_labels
    - command: ndevio.make_neuron_labels_processed
      display_name: Neuron Labels Processed (2D+4Ch)
      key: ndevio.neuron_labels_processed
